LoginRequest:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      description: User email address
      example: user@example.com
    password:
      type: string
      format: password
      description: User password
      example: SecureP@ss123

RegisterRequest:
  type: object
  required:
    - email
    - password
    - firstName
    - lastName
  properties:
    email:
      type: string
      format: email
      description: User email address
      example: user@example.com
    password:
      type: string
      format: password
      description: User password (min 8 characters, must include uppercase, lowercase, number, and special character)
      example: SecureP@ss123
      minLength: 8
    firstName:
      type: string
      description: User first name
      example: John
      minLength: 1
      maxLength: 50
    lastName:
      type: string
      description: User last name
      example: Doe
      minLength: 1
      maxLength: 50

AuthResponse:
  type: object
  required:
    - accessToken
    - refreshToken
    - expiresIn
    - user
  properties:
    accessToken:
      type: string
      description: JWT access token
      example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    refreshToken:
      type: string
      description: JWT refresh token
      example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    expiresIn:
      type: integer
      description: Token expiration time in seconds
      example: 86400
    tokenType:
      type: string
      description: Token type
      example: Bearer
      default: Bearer
    user:
      $ref: './user.yaml#/User'

RefreshTokenRequest:
  type: object
  required:
    - refreshToken
  properties:
    refreshToken:
      type: string
      description: JWT refresh token
      example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

RefreshTokenResponse:
  type: object
  required:
    - accessToken
    - expiresIn
  properties:
    accessToken:
      type: string
      description: New JWT access token
      example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    expiresIn:
      type: integer
      description: Token expiration time in seconds
      example: 86400
    tokenType:
      type: string
      description: Token type
      example: Bearer
      default: Bearer
