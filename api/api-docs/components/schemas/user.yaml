User:
  type: object
  required:
    - id
    - email
    - role
    - plan
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
      description: Unique user identifier (obfuscated)
      example: a7b3c4d5-e6f7-8901-2345-6789abcdef01
    email:
      type: string
      format: email
      description: User email address
      example: user@example.com
    phone:
      type: string
      pattern: '^\+[1-9]\d{1,14}$'
      description: Phone number in E.164 format
      example: '+12025551234'
    firstName:
      type: string
      description: User first name
      example: John
      minLength: 1
      maxLength: 50
    lastName:
      type: string
      description: User last name
      example: Doe
      minLength: 1
      maxLength: 50
    preferredAuthMethod:
      type: string
      enum:
        - email
        - sms
      description: Preferred authentication method
      example: email
      default: email
    timezone:
      type: string
      description: User timezone
      example: America/New_York
    role:
      type: string
      enum:
        - admin
        - manager
        - user
      description: User role for RBAC
      example: user
    plan:
      type: string
      enum:
        - free
        - pro
        - enterprise
      description: User subscription plan (affects device limits)
      example: free
      default: free
    maxDevices:
      type: integer
      description: Maximum allowed devices for this user
      example: 3
      minimum: 1
    isActive:
      type: boolean
      description: Whether the user account is active
      example: true
      default: true
    emailVerified:
      type: boolean
      description: Whether email is verified
      example: true
      default: false
    phoneVerified:
      type: boolean
      description: Whether phone is verified
      example: false
      default: false
    lastLoginAt:
      type: string
      format: date-time
      description: Timestamp of last login
      example: '2025-10-02T12:34:56.789Z'
    createdAt:
      type: string
      format: date-time
      description: Account creation timestamp
      example: '2025-10-01T10:00:00.000Z'
    updatedAt:
      type: string
      format: date-time
      description: Last update timestamp
      example: '2025-10-02T12:34:56.789Z'

UserUpdate:
  type: object
  properties:
    firstName:
      type: string
      description: User first name
      example: John
      minLength: 1
      maxLength: 50
    lastName:
      type: string
      description: User last name
      example: Doe
      minLength: 1
      maxLength: 50
    isActive:
      type: boolean
      description: Whether the user account is active
      example: true
