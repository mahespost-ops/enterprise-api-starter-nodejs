User:
  type: object
  required:
    - id
    - email
    - role
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
      description: Unique user identifier (obfuscated)
      example: a7b3c4d5-e6f7-8901-2345-6789abcdef01
    email:
      type: string
      format: email
      description: User email address
      example: user@example.com
    firstName:
      type: string
      description: User first name
      example: John
      minLength: 1
      maxLength: 50
    lastName:
      type: string
      description: User last name
      example: Doe
      minLength: 1
      maxLength: 50
    role:
      type: string
      enum:
        - admin
        - manager
        - user
      description: User role for RBAC
      example: user
    isActive:
      type: boolean
      description: Whether the user account is active
      example: true
      default: true
    lastLoginAt:
      type: string
      format: date-time
      description: Timestamp of last login
      example: '2025-10-02T12:34:56.789Z'
    createdAt:
      type: string
      format: date-time
      description: Account creation timestamp
      example: '2025-10-01T10:00:00.000Z'
    updatedAt:
      type: string
      format: date-time
      description: Last update timestamp
      example: '2025-10-02T12:34:56.789Z'

UserInput:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      description: User email address
      example: user@example.com
    password:
      type: string
      format: password
      description: User password (min 8 characters, must include uppercase, lowercase, number, and special character)
      example: SecureP@ss123
      minLength: 8
    firstName:
      type: string
      description: User first name
      example: John
      minLength: 1
      maxLength: 50
    lastName:
      type: string
      description: User last name
      example: Doe
      minLength: 1
      maxLength: 50
    role:
      type: string
      enum:
        - admin
        - manager
        - user
      description: User role for RBAC
      example: user
      default: user

UserUpdate:
  type: object
  properties:
    firstName:
      type: string
      description: User first name
      example: John
      minLength: 1
      maxLength: 50
    lastName:
      type: string
      description: User last name
      example: Doe
      minLength: 1
      maxLength: 50
    isActive:
      type: boolean
      description: Whether the user account is active
      example: true
