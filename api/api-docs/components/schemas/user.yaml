User:
  type: object
  description: |
    User identity schema following OpenID Connect, PortableContacts, and Schema.org Person standards.
    Designed to support future OAuth/SSO integration.
  required:
    - id
    - email
    - given_name
    - family_name
    - created_at
    - updated_at
  properties:
    id:
      type: string
      format: uuid
      description: Unique user identifier (sub claim in OIDC)
      example: a7b3c4d5-e6f7-8901-2345-6789abcdef01
    email:
      type: string
      format: email
      description: User email address (OIDC standard claim)
      example: user@example.com
    email_verified:
      type: boolean
      description: Whether email is verified (OIDC standard claim)
      example: true
      default: false
    phone_number:
      type: string
      pattern: '^\+[1-9]\d{1,14}$'
      description: Phone number in E.164 format (OIDC standard claim)
      example: '+12025551234'
    phone_number_verified:
      type: boolean
      description: Whether phone is verified (OIDC standard claim)
      example: false
      default: false
    given_name:
      type: string
      description: Given name / first name (OIDC standard claim)
      example: John
      minLength: 1
      maxLength: 50
    family_name:
      type: string
      description: Family name / last name (OIDC standard claim)
      example: Doe
      minLength: 1
      maxLength: 50
    middle_name:
      type: string
      description: Middle name (OIDC standard claim)
      example: Michael
      maxLength: 50
    name:
      type: string
      description: Full name (computed, OIDC standard claim)
      example: John Doe
      readOnly: true
    nickname:
      type: string
      description: Casual name or alias (OIDC standard claim)
      example: Johnny
      maxLength: 50
    preferred_username:
      type: string
      description: Preferred username (OIDC standard claim)
      example: johndoe
      maxLength: 50
    profile:
      type: string
      format: uri
      description: URL to user's profile page (OIDC standard claim, Schema.org url)
      example: https://example.com/users/johndoe
    picture:
      type: string
      format: uri
      description: URL to user's profile picture (OIDC standard claim, Schema.org image)
      example: https://cdn.example.com/avatars/johndoe.jpg
    website:
      type: string
      format: uri
      description: User's website (OIDC standard claim, Schema.org url)
      example: https://johndoe.com
    gender:
      type: string
      description: User's gender (OIDC standard claim)
      example: male
    birthdate:
      type: string
      format: date
      description: Birthdate in YYYY-MM-DD format (OIDC standard claim)
      example: '1990-01-15'
    zoneinfo:
      type: string
      description: Timezone (OIDC standard claim, IANA Time Zone Database)
      example: America/New_York
    locale:
      type: string
      description: Locale (OIDC standard claim, RFC 5646)
      example: en-US
    preferred_auth_method:
      type: string
      enum:
        - email
        - sms
      description: Preferred authentication method
      example: email
      default: email
    is_active:
      type: boolean
      description: Whether the user account is active
      example: true
      default: true
    last_login_at:
      type: string
      format: date-time
      description: Timestamp of last login (UTC)
      example: '2025-10-02T12:34:56Z'
    created_at:
      type: string
      format: date-time
      description: Account creation timestamp (UTC)
      example: '2025-10-01T10:00:00Z'
    updated_at:
      type: string
      format: date-time
      description: Last update timestamp (UTC)
      example: '2025-10-02T12:34:56Z'
    deleted_at:
      type: string
      format: date-time
      nullable: true
      description: Soft-delete timestamp (UTC)
      example: null

