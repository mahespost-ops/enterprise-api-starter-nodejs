Session:
  type: object
  required:
    - id
    - userId
    - deviceId
    - ipAddress
    - createdAt
    - lastAccessedAt
    - expiresAt
    - isActive
  properties:
    id:
      type: string
      format: uuid
      description: Unique session identifier
      example: s1e2s3a4-b5c6-7890-1234-567890abcdef
    userId:
      type: string
      format: uuid
      description: User ID
      example: a7b3c4d5-e6f7-8901-2345-6789abcdef01
    deviceId:
      type: string
      format: uuid
      description: Device ID
      example: d1e2f3a4-b5c6-7890-1234-567890abcdef
    deviceName:
      type: string
      description: Device name for display
      example: Chrome on macOS
    ipAddress:
      type: string
      format: ipv4
      description: Current IP address
      example: 192.168.1.100
    userAgent:
      type: string
      description: User agent string
      example: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)...
    geoLocation:
      type: object
      description: Geographic location from GeoIP
      properties:
        country:
          type: string
          description: Country code (ISO 3166-1 alpha-2)
          example: US
        region:
          type: string
          description: Region/state
          example: New York
        city:
          type: string
          description: City
          example: New York City
        coordinates:
          type: object
          properties:
            lat:
              type: number
              format: float
              example: 40.7128
            lon:
              type: number
              format: float
              example: -74.0060
    requestCount:
      type: integer
      description: Number of requests made in this session
      example: 42
      minimum: 0
    lastActivityType:
      type: string
      description: Type of last activity
      example: read
      maxLength: 50
    createdAt:
      type: string
      format: date-time
      description: Session creation timestamp
      example: '2025-10-02T10:00:00.000Z'
    lastAccessedAt:
      type: string
      format: date-time
      description: Last access timestamp
      example: '2025-10-02T12:34:56.789Z'
    expiresAt:
      type: string
      format: date-time
      description: Session expiration timestamp
      example: '2025-11-01T10:00:00.000Z'
    isActive:
      type: boolean
      description: Whether session is active
      example: true
    isCurrent:
      type: boolean
      description: Whether this is the current session
      example: false
    revokedAt:
      type: string
      format: date-time
      description: When session was revoked (if applicable)
      example: '2025-10-03T08:15:00.000Z'
    revokedBy:
      type: string
      format: uuid
      description: User ID who revoked the session (for admin actions)
      example: a7b3c4d5-e6f7-8901-2345-6789abcdef01
    revocationReason:
      type: string
      description: Reason for revocation
      example: User logged out
      maxLength: 255

SessionList:
  type: object
  required:
    - sessions
    - total
  properties:
    sessions:
      type: array
      items:
        $ref: '#/Session'
    total:
      type: integer
      description: Total number of sessions
      example: 3
    active:
      type: integer
      description: Number of active sessions
      example: 2

SessionRevocationRequest:
  type: object
  properties:
    reason:
      type: string
      description: Optional reason for revocation
      example: Suspicious activity detected
      maxLength: 255
