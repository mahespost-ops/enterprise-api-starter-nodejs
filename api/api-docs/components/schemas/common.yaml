Error:
  type: object
  required:
    - status
    - message
  properties:
    status:
      type: integer
      description: HTTP status code
      example: 400
    message:
      type: string
      description: Detailed, human-readable explanation of what went wrong
      example: Invalid input parameters
    error:
      type: string
      description: Generic HTTP status message
      example: Bad Request
    timestamp:
      type: string
      format: date-time
      description: Timestamp of the error
      example: '2025-10-02T12:34:56.789Z'
    path:
      type: string
      description: Request path that caused the error
      example: /api/v1/users

ValidationError:
  type: object
  required:
    - status
    - message
    - errors
  properties:
    status:
      type: integer
      description: HTTP status code
      example: 422
    message:
      type: string
      description: Detailed, human-readable explanation of what went wrong
      example: Validation Failed
    errors:
      type: array
      description: List of validation errors
      items:
        type: object
        properties:
          field:
            type: string
            description: Field that failed validation
            example: email
          message:
            type: string
            description: Validation error message
            example: Invalid email format
          value:
            description: Invalid value provided
            example: invalid-email
    timestamp:
      type: string
      format: date-time
      description: Timestamp of the error
      example: '2025-10-02T12:34:56.789Z'

OffsetPaginationInfo:
  type: object
  required:
    - limit
    - offset
    - total
    - hasMore
  properties:
    limit:
      type: integer
      description: Number of items requested per page
      example: 20
      minimum: 1
      maximum: 100
    offset:
      type: integer
      description: Number of items skipped
      example: 0
      minimum: 0
    total:
      type: integer
      description: Total number of items available
      example: 150
      minimum: 0
    hasMore:
      type: boolean
      description: Whether there are more items available beyond this page
      example: true

CursorPaginationInfo:
  type: object
  required:
    - limit
    - hasMore
  properties:
    limit:
      type: integer
      description: Number of items requested per page
      example: 100
      minimum: 1
      maximum: 100
    nextCursor:
      type: string
      description: |
        Opaque cursor to fetch the next page of results.
        Pass this value as the `cursor` query parameter for the next request.
        Only present when hasMore is true.
      example: 'eyJpZCI6IjEyMzQ1Njc4LTkwYWItY2RlZi0xMjM0LTU2Nzg5MGFiY2RlZiIsInRzIjoxNjk2MzQ1Njc4fQ=='
    hasMore:
      type: boolean
      description: Whether there are more items available beyond this page
      example: true
