openapi: 3.0.3
info:
  title: Enterprise API
  description: |
    Enterprise-grade REST API with RBAC, JWT authentication, and comprehensive security features.

    ## Authentication
    Most endpoints require JWT authentication. Include the token in the Authorization header:
    ```
    Authorization: Bearer <token>
    ```

    ## Rate Limiting
    API requests are rate-limited to prevent abuse. Default limits:
    - 100 requests per 15 minutes per IP

    ## Error Handling
    All errors follow a consistent format with appropriate HTTP status codes and error messages.
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com
  license:
    name: Proprietary

servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://api-dev.example.com/api/v1
    description: Development environment
  - url: https://api-staging.example.com/api/v1
    description: Staging environment
  - url: https://api.example.com/api/v1
    description: Production environment

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: User authentication and authorization
  - name: Users
    description: User management
  - name: Health
    description: Health check endpoints

paths:
  /health:
    $ref: './paths/health.yaml#/health'
  /auth/register:
    $ref: './paths/auth.yaml#/register'
  /auth/login:
    $ref: './paths/auth.yaml#/login'
  /auth/refresh:
    $ref: './paths/auth.yaml#/refresh'
  /auth/logout:
    $ref: './paths/auth.yaml#/logout'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authenticated requests

  responses:
    UnauthorizedError:
      description: Authentication token is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 401
            message: Unauthorized
            error: Invalid or missing authentication token

    ForbiddenError:
      description: User does not have permission to access this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 403
            message: Forbidden
            error: Insufficient permissions

    NotFoundError:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 404
            message: Not Found
            error: Resource not found

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 500
            message: Internal Server Error
            error: An unexpected error occurred

  schemas:
    Error:
      $ref: './components/schemas/common.yaml#/Error'
    ValidationError:
      $ref: './components/schemas/common.yaml#/ValidationError'
    User:
      $ref: './components/schemas/user.yaml#/User'
    AuthResponse:
      $ref: './components/schemas/auth.yaml#/AuthResponse'
