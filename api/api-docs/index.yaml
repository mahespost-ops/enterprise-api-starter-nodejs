openapi: 3.0.3
info:
  title: Enterprise API
  description: |
    Enterprise-grade REST API with RBAC, JWT authentication, and comprehensive security features.

    ## Authentication
    Most endpoints require JWT authentication. Include the token in the Authorization header:
    ```
    Authorization: Bearer <token>
    ```

    ## Rate Limiting
    API requests are rate-limited to prevent abuse. Default limits:
    - 100 requests per 15 minutes per IP

    ## Error Handling
    All errors follow a consistent format with appropriate HTTP status codes and error messages.
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com
  license:
    name: Proprietary

servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://api-dev.example.com/api/v1
    description: Development environment
  - url: https://api-staging.example.com/api/v1
    description: Staging environment
  - url: https://api.example.com/api/v1
    description: Production environment

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Health check endpoints
  - name: Authentication
    description: Passwordless authentication with magic tokens
  - name: Organizations
    description: Multi-tenant organization management
  - name: Environments
    description: Environment management within organizations
  - name: Members
    description: Organization member management, invitations, and organization-scoped impersonation (requires members:manage or members:impersonate)
  - name: Groups
    description: Hierarchical group management for RBAC
  - name: Users
    description: User management
  - name: Admin - Role Assignments
    description: System-wide role assignment management (requires admin:assignments:read or admin:assignments:manage)
  - name: Admin - Users
    description: System-wide user management (requires admin:users:read or admin:users:manage)
  - name: Admin - Organizations
    description: System-wide organization management (requires admin:organizations:read or admin:organizations:manage)
  - name: Admin - Environments
    description: System-wide environment management (requires admin:environments:read or admin:environments:manage)
  - name: Admin - Groups
    description: System-wide group management (requires admin:groups:read or admin:groups:manage)
  - name: Admin - Roles & Permissions
    description: System-wide role and permission management (requires admin:roles:read, admin:roles:manage, or admin:permissions:read)
  - name: Admin - Devices
    description: System-wide device management (requires admin:devices:read or admin:devices:manage)
  - name: Admin - Sessions
    description: System-wide session management (requires admin:sessions:read or admin:sessions:manage)
  - name: Admin - Impersonation
    description: System-wide user impersonation and session monitoring (requires admin:users:impersonate, admin:impersonation:read, or admin:impersonation:manage)

