components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authenticated requests

  responses:
    UnauthorizedError:
      $ref: './components/responses.yaml#/UnauthorizedError'
    ForbiddenError:
      $ref: './components/responses.yaml#/ForbiddenError'
    NotFoundError:
      $ref: './components/responses.yaml#/NotFoundError'
    ValidationError:
      $ref: './components/responses.yaml#/ValidationError'
    RateLimitError:
      $ref: './components/responses.yaml#/RateLimitError'
    InternalServerError:
      $ref: './components/responses.yaml#/InternalServerError'

  schemas:
    Error:
      $ref: './components/schemas/common.yaml#/Error'
    ValidationError:
      $ref: './components/schemas/common.yaml#/ValidationError'
    PaginationInfo:
      $ref: './components/schemas/common.yaml#/PaginationInfo'
    User:
      $ref: './components/schemas/user.yaml#/User'
    AuthResponse:
      $ref: './components/schemas/auth.yaml#/AuthResponse'
    Organization:
      $ref: './components/schemas/organization.yaml#/Organization'
    Environment:
      $ref: './components/schemas/environment.yaml#/Environment'
    OrganizationMember:
      $ref: './components/schemas/member.yaml#/OrganizationMember'
    Group:
      $ref: './components/schemas/group.yaml#/Group'
    Role:
      $ref: './components/schemas/role.yaml#/Role'
    Permission:
      $ref: './components/schemas/role.yaml#/Permission'
    RoleAssignment:
      $ref: './components/schemas/role-assignment.yaml#/RoleAssignment'
