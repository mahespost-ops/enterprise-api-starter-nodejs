openapi: 3.0.3
info:
  title: Enterprise API
  description: |
    Enterprise-grade REST API with RBAC, JWT authentication, and comprehensive security features.

    ## Authentication
    Most endpoints require JWT authentication. Include the token in the Authorization header:
    ```
    Authorization: Bearer <token>
    ```

    ## Rate Limiting
    API requests are rate-limited to prevent abuse. Default limits:
    - 100 requests per 15 minutes per IP

    ## Error Handling
    All errors follow a consistent format with appropriate HTTP status codes and error messages.
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com
  license:
    name: Proprietary

servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://api-dev.example.com/api/v1
    description: Development environment
  - url: https://api-staging.example.com/api/v1
    description: Staging environment
  - url: https://api.example.com/api/v1
    description: Production environment

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Health check endpoints
  - name: Authentication
    description: Passwordless authentication with magic tokens
  - name: Organizations
    description: Multi-tenant organization management
  - name: Environments
    description: Environment management within organizations
  - name: Members
    description: Organization member management and invitations
  - name: Groups
    description: Hierarchical group management for RBAC
  - name: Admin - Roles & Permissions
    description: System-wide role and permission management (requires system:admin or system:support)
  - name: Role Assignments
    description: Environment-scoped role assignments to members and groups
  - name: Users
    description: User management
  - name: Devices
    description: Device management and fingerprinting
  - name: Sessions
    description: Session management and monitoring

paths:
  /health:
    $ref: './paths/health.yaml#/health'
  /auth/register:
    $ref: './paths/auth.yaml#/register'
  /auth/request-token:
    $ref: './paths/auth.yaml#/requestToken'
  /auth/verify-token:
    $ref: './paths/auth.yaml#/verifyToken'
  /auth/refresh:
    $ref: './paths/auth.yaml#/refresh'
  /auth/logout:
    $ref: './paths/auth.yaml#/logout'
  /users/me:
    get:
      $ref: './paths/users.yaml#/getCurrentUser/get'
    put:
      $ref: './paths/users.yaml#/updateCurrentUser/put'
  /users/me/organizations:
    get:
      $ref: './paths/users.yaml#/getCurrentUserOrganizations/get'
  /users/me/permissions:
    get:
      $ref: './paths/users.yaml#/getCurrentUserPermissions/get'
  /orgs:
    get:
      $ref: './paths/organizations.yaml#/listOrganizations/get'
    post:
      $ref: './paths/organizations.yaml#/createOrganization/post'
  /orgs/{orgId}:
    get:
      $ref: './paths/organizations.yaml#/getOrganization/get'
    put:
      $ref: './paths/organizations.yaml#/getOrganization/put'
    delete:
      $ref: './paths/organizations.yaml#/getOrganization/delete'
  /orgs/{orgId}/switch:
    $ref: './paths/organizations.yaml#/switchContext'
  /orgs/{orgId}/envs:
    get:
      $ref: './paths/environments.yaml#/listEnvironments/get'
    post:
      $ref: './paths/environments.yaml#/createEnvironment/post'
  /orgs/{orgId}/envs/{envId}:
    get:
      $ref: './paths/environments.yaml#/getEnvironment/get'
    put:
      $ref: './paths/environments.yaml#/getEnvironment/put'
    delete:
      $ref: './paths/environments.yaml#/getEnvironment/delete'
  /orgs/{orgId}/members:
    get:
      $ref: './paths/members.yaml#/listMembers/get'
    post:
      $ref: './paths/members.yaml#/inviteMember/post'
  /orgs/{orgId}/members/{memberId}:
    get:
      $ref: './paths/members.yaml#/getMember/get'
    put:
      $ref: './paths/members.yaml#/updateMember/put'
    delete:
      $ref: './paths/members.yaml#/removeMember/delete'
  /orgs/{orgId}/groups:
    get:
      $ref: './paths/groups.yaml#/listGroups/get'
    post:
      $ref: './paths/groups.yaml#/createGroup/post'
  /orgs/{orgId}/groups/{groupId}:
    get:
      $ref: './paths/groups.yaml#/getGroup/get'
    put:
      $ref: './paths/groups.yaml#/updateGroup/put'
    delete:
      $ref: './paths/groups.yaml#/deleteGroup/delete'
  /orgs/{orgId}/groups/{groupId}/members:
    get:
      $ref: './paths/groups.yaml#/listGroupMembers/get'
    post:
      $ref: './paths/groups.yaml#/addGroupMember/post'
  /orgs/{orgId}/groups/{groupId}/members/{userId}:
    delete:
      $ref: './paths/groups.yaml#/removeGroupMember/delete'
  /orgs/{orgId}/groups/{groupId}/children:
    $ref: './paths/groups.yaml#/getGroupChildren'
  /admin/roles:
    get:
      $ref: './paths/admin-roles.yaml#/listRoles/get'
    post:
      $ref: './paths/admin-roles.yaml#/createRole/post'
  /admin/roles/{roleId}:
    get:
      $ref: './paths/admin-roles.yaml#/getRole/get'
    put:
      $ref: './paths/admin-roles.yaml#/updateRole/put'
    delete:
      $ref: './paths/admin-roles.yaml#/deleteRole/delete'
  /admin/roles/{roleId}/permissions:
    get:
      $ref: './paths/admin-roles.yaml#/listRolePermissions/get'
    post:
      $ref: './paths/admin-roles.yaml#/addRolePermission/post'
  /admin/roles/{roleId}/permissions/{permissionId}:
    delete:
      $ref: './paths/admin-roles.yaml#/removeRolePermission/delete'
  /admin/permissions:
    get:
      $ref: './paths/admin-roles.yaml#/listPermissions/get'
  /orgs/{orgId}/envs/{envId}/assignments:
    get:
      $ref: './paths/role-assignments.yaml#/listRoleAssignments/get'
    post:
      $ref: './paths/role-assignments.yaml#/createRoleAssignment/post'
  /orgs/{orgId}/envs/{envId}/assignments/{assignmentId}:
    delete:
      $ref: './paths/role-assignments.yaml#/deleteRoleAssignment/delete'
  /devices:
    $ref: './paths/devices.yaml#/listDevices'
  /devices/{id}:
    put:
      $ref: './paths/devices.yaml#/updateDevice/put'
    delete:
      $ref: './paths/devices.yaml#/revokeDevice/delete'
  /sessions:
    $ref: './paths/sessions.yaml#/listSessions'
  /sessions/{id}:
    get:
      $ref: './paths/sessions.yaml#/getSession/get'
    delete:
      $ref: './paths/sessions.yaml#/revokeSession/delete'
  /sessions/device/{deviceId}:
    $ref: './paths/sessions.yaml#/revokeDeviceSessions'
  /sessions/all:
    $ref: './paths/sessions.yaml#/revokeAllSessionsExceptCurrent'
  /sessions/all/force:
    $ref: './paths/sessions.yaml#/revokeAllSessions'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authenticated requests

  responses:
    UnauthorizedError:
      $ref: './components/responses.yaml#/UnauthorizedError'
    ForbiddenError:
      $ref: './components/responses.yaml#/ForbiddenError'
    NotFoundError:
      $ref: './components/responses.yaml#/NotFoundError'
    ValidationError:
      $ref: './components/responses.yaml#/ValidationError'
    RateLimitError:
      $ref: './components/responses.yaml#/RateLimitError'
    InternalServerError:
      $ref: './components/responses.yaml#/InternalServerError'

  schemas:
    Error:
      $ref: './components/schemas/common.yaml#/Error'
    ValidationError:
      $ref: './components/schemas/common.yaml#/ValidationError'
    PaginationInfo:
      $ref: './components/schemas/common.yaml#/PaginationInfo'
    User:
      $ref: './components/schemas/user.yaml#/User'
    AuthResponse:
      $ref: './components/schemas/auth.yaml#/AuthResponse'
    Organization:
      $ref: './components/schemas/organization.yaml#/Organization'
    Environment:
      $ref: './components/schemas/environment.yaml#/Environment'
    OrganizationMember:
      $ref: './components/schemas/member.yaml#/OrganizationMember'
    Group:
      $ref: './components/schemas/group.yaml#/Group'
    Role:
      $ref: './components/schemas/role.yaml#/Role'
    Permission:
      $ref: './components/schemas/role.yaml#/Permission'
    RoleAssignment:
      $ref: './components/schemas/role-assignment.yaml#/RoleAssignment'
