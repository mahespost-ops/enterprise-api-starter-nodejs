listEventTypes:
  get:
    tags:
      - Admin - Events
    summary: List all event types
    description: |
      Get all event types (verb mappings to HTTP methods and paths).
      Requires `admin:events:read` permission.

      **Filterable fields:**
      - `verb` (eq, ne, in, nin) - Event verb/type (e.g., "auth.login", "device.update")
      - `httpMethod` (eq, ne, in, nin) - Values: GET, POST, PUT, PATCH, DELETE
      - `isWebhookEvent` (eq) - Values: true, false
      - `createdAt` (eq, ne, gt, gte, lt, lte) - ISO 8601 timestamp

      **Sortable fields:**
      - `verb` (default: verb, indexed)
      - `httpMethod` (not indexed)
      - `createdAt` (indexed)

      **Searchable fields:**
      - Full-text search across verb, httpPath, description (case-insensitive)

      **Selectable fields:**
      - All fields: id, verb, httpMethod, httpPath, description, isWebhookEvent, createdAt

      **Examples:**
      ```
      # All webhook-triggering event types
      ?filter[isWebhookEvent]=true

      # Authentication-related event types
      ?search=auth&sort=verb

      # POST endpoints only
      ?filter[httpMethod]=POST&sort=-createdAt
      ```
    operationId: adminListEventTypes
    security:
      - bearerAuth: ["admin:events:read"]
    parameters:
      # Pagination
      - $ref: '../components/parameters.yaml#/limit'
      - $ref: '../components/parameters.yaml#/offset'
      # Sorting
      - $ref: '../components/parameters.yaml#/sort'
      # Search
      - $ref: '../components/parameters.yaml#/search'
      # Field Selection
      - $ref: '../components/parameters.yaml#/fields'
      # Filters
      - name: filter[verb]
        in: query
        required: false
        description: |
          Filter by event verb (supports: eq, ne, in, nin)
          Example: "auth.login"
        schema:
          type: string
        example: 'auth.login'
      - name: filter[verb][in]
        in: query
        required: false
        description: Filter by multiple event verbs (comma-separated)
        schema:
          type: string
        example: 'auth.login,auth.logout,device.update'
      - name: filter[httpMethod]
        in: query
        required: false
        description: |
          Filter by HTTP method (supports: eq, ne, in, nin)
          Values: GET, POST, PUT, PATCH, DELETE
        schema:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
        example: 'POST'
      - name: filter[isWebhookEvent]
        in: query
        required: false
        description: |
          Filter by webhook eligibility (supports: eq)
          Values: true, false
        schema:
          type: boolean
        example: true
      - name: filter[createdAt][gte]
        in: query
        required: false
        description: Filter event types created on or after this date (ISO 8601, UTC)
        schema:
          type: string
          format: date-time
        example: '2025-01-01T00:00:00Z'
    responses:
      '200':
        description: Event types retrieved successfully
        content:
          application/json:
            schema:
              type: object
              required:
                - data
                - pagination
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas/event-type.yaml#/EventType'
                pagination:
                  $ref: '../components/schemas/common.yaml#/OffsetPaginationInfo'
            examples:
              default:
                summary: Standard list response
                value:
                  data:
                    - id: 'k4ff178c-8fbd-3ccc-9902-kmh4o6543002'
                      verb: 'auth.login'
                      httpMethod: 'POST'
                      httpPath: '/api/v1/auth/verify-token'
                      description: 'User authentication via magic link or OAuth'
                      isWebhookEvent: true
                      createdAt: '2025-10-03T14:30:00Z'
                    - id: 'l5gg289d-9gce-4ddd-0013-lni5p7654113'
                      verb: 'device.update'
                      httpMethod: 'PUT'
                      httpPath: '/api/v1/orgs/{orgId}/envs/{envId}/devices/{deviceId}'
                      description: 'Device trust status or name updated'
                      isWebhookEvent: true
                      createdAt: '2025-10-03T14:30:00Z'
                  pagination:
                    limit: 20
                    offset: 0
                    total: 47
                    hasMore: true
      '400':
        $ref: '../index.yaml#/components/responses/BadRequestError'
      '401':
        $ref: '../index.yaml#/components/responses/UnauthorizedError'
      '403':
        $ref: '../index.yaml#/components/responses/ForbiddenError'
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'

createEventType:
  post:
    tags:
      - Admin - Events
    summary: Create event type
    description: |
      Create a new event type mapping (requires admin:events:manage permission).
      Event types map HTTP endpoints to event verbs for the activity log.
    operationId: adminCreateEventType
    security:
      - bearerAuth: ["admin:events:manage"]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/event-type.yaml#/EventTypeCreateRequest'
          examples:
            default:
              summary: Create authentication event type
              value:
                verb: 'auth.login'
                httpMethod: 'POST'
                httpPath: '/api/v1/auth/verify-token'
                description: 'User authentication via magic link or OAuth'
                isWebhookEvent: true
    responses:
      '201':
        description: Event type created successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/event-type.yaml#/EventType'
      '400':
        $ref: '../index.yaml#/components/responses/BadRequestError'
      '401':
        $ref: '../index.yaml#/components/responses/UnauthorizedError'
      '403':
        $ref: '../index.yaml#/components/responses/ForbiddenError'
      '409':
        description: Event type with this verb already exists
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  example: 'CONFLICT'
                message:
                  type: string
                  example: 'Event type with verb "auth.login" already exists'
      '422':
        $ref: '../index.yaml#/components/responses/ValidationError'
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'

getEventType:
  get:
    tags:
      - Admin - Events
    summary: Get event type details
    description: Retrieve detailed information about a specific event type (requires admin:events:read permission)
    operationId: adminGetEventType
    security:
      - bearerAuth: ["admin:events:read"]
    parameters:
      - $ref: '../components/parameters.yaml#/eventTypeId'
    responses:
      '200':
        description: Event type retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/event-type.yaml#/EventType'
      '401':
        $ref: '../index.yaml#/components/responses/UnauthorizedError'
      '403':
        $ref: '../index.yaml#/components/responses/ForbiddenError'
      '404':
        $ref: '../index.yaml#/components/responses/NotFoundError'
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'

updateEventType:
  put:
    tags:
      - Admin - Events
    summary: Update event type
    description: |
      Update event type details (requires admin:events:manage permission).
      Note: The verb cannot be changed once created.
    operationId: adminUpdateEventType
    security:
      - bearerAuth: ["admin:events:manage"]
    parameters:
      - $ref: '../components/parameters.yaml#/eventTypeId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/event-type.yaml#/EventTypeUpdateRequest'
          examples:
            default:
              summary: Update event type
              value:
                httpMethod: 'POST'
                httpPath: '/api/v1/auth/verify-token'
                description: 'User authentication via magic link, OAuth, or SSO'
                isWebhookEvent: true
    responses:
      '200':
        description: Event type updated successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/event-type.yaml#/EventType'
      '400':
        $ref: '../index.yaml#/components/responses/BadRequestError'
      '401':
        $ref: '../index.yaml#/components/responses/UnauthorizedError'
      '403':
        $ref: '../index.yaml#/components/responses/ForbiddenError'
      '404':
        $ref: '../index.yaml#/components/responses/NotFoundError'
      '422':
        $ref: '../index.yaml#/components/responses/ValidationError'
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'

deleteEventType:
  delete:
    tags:
      - Admin - Events
    summary: Delete event type
    description: |
      Delete an event type (requires admin:events:manage permission).
      This will prevent future events from being logged for this endpoint,
      but will not delete existing events in the log.
    operationId: adminDeleteEventType
    security:
      - bearerAuth: ["admin:events:manage"]
    parameters:
      - $ref: '../components/parameters.yaml#/eventTypeId'
    responses:
      '204':
        description: Event type deleted successfully
      '401':
        $ref: '../index.yaml#/components/responses/UnauthorizedError'
      '403':
        $ref: '../index.yaml#/components/responses/ForbiddenError'
      '404':
        $ref: '../index.yaml#/components/responses/NotFoundError'
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'
