# Admin - Roles & Permissions Endpoints

listRoles:
  get:
    tags:
      - Admin - Roles & Permissions
    summary: List roles
    description: Get all roles (globally scoped, requires admin:roles:read permission)
    operationId: listRoles
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/limit'
      - $ref: '../components/parameters.yaml#/offset'
      - $ref: '../components/parameters.yaml#/search'
      - name: includeSystem
        in: query
        required: false
        description: Include system-defined roles
        schema:
          type: boolean
          default: true
        example: true
    responses:
      '200':
        description: Roles retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/role.yaml#/RoleList'
      '401':
        $ref: '../index.yaml#/components/responses/UnauthorizedError'
      '403':
        $ref: '../index.yaml#/components/responses/ForbiddenError'
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'

getRole:
  get:
    tags:
      - Admin - Roles & Permissions
    summary: Get role details
    description: Retrieve detailed information about a specific role (requires admin:roles:read permission)
    operationId: getRole
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/roleId'
    responses:
      '200':
        description: Role retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/role.yaml#/Role'
      '401':
        $ref: '../index.yaml#/components/responses/UnauthorizedError'
      '403':
        $ref: '../index.yaml#/components/responses/ForbiddenError'
      '404':
        $ref: '../index.yaml#/components/responses/NotFoundError'
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'

updateRole:
  put:
    tags:
      - Admin - Roles & Permissions
    summary: Update role
    description: |
      Update role details (requires admin:roles:manage permission).
      System-defined roles cannot be updated.
    operationId: updateRole
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/roleId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/role.yaml#/RoleUpdateRequest'
    responses:
      '200':
        description: Role updated successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/role.yaml#/Role'
      '401':
        $ref: '../index.yaml#/components/responses/UnauthorizedError'
      '403':
        $ref: '../index.yaml#/components/responses/ForbiddenError'
      '404':
        $ref: '../index.yaml#/components/responses/NotFoundError'
      '409':
        description: Cannot update system role
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/Error'
            example:
              status: 409
              message: Conflict
              error: System-defined roles cannot be updated
      '422':
        $ref: '../index.yaml#/components/responses/ValidationError'
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'

deleteRole:
  delete:
    tags:
      - Admin - Roles & Permissions
    summary: Delete role
    description: |
      Soft-delete a role (requires admin:roles:manage permission).
      System-defined roles cannot be deleted.
      Role assignments are removed when role is deleted.
    operationId: deleteRole
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/roleId'
    responses:
      '204':
        description: Role deleted successfully
      '401':
        $ref: '../index.yaml#/components/responses/UnauthorizedError'
      '403':
        $ref: '../index.yaml#/components/responses/ForbiddenError'
      '404':
        $ref: '../index.yaml#/components/responses/NotFoundError'
      '409':
        description: Cannot delete system role
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/Error'
            example:
              status: 409
              message: Conflict
              error: System-defined roles cannot be deleted
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'

createRole:
  post:
    tags:
      - Admin - Roles & Permissions
    summary: Create role
    description: Create a new role (requires admin:roles:manage permission)
    operationId: createRole
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/role.yaml#/RoleCreateRequest'
    responses:
      '201':
        description: Role created successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/role.yaml#/Role'
      '401':
        $ref: '../index.yaml#/components/responses/UnauthorizedError'
      '403':
        $ref: '../index.yaml#/components/responses/ForbiddenError'
      '409':
        description: Role name already exists
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/Error'
            example:
              status: 409
              message: Conflict
              error: Role with this name already exists
      '422':
        $ref: '../index.yaml#/components/responses/ValidationError'
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'

listRolePermissions:
  get:
    tags:
      - Admin - Roles & Permissions
    summary: List role permissions
    description: Get all permissions assigned to a role (requires admin:roles:read permission)
    operationId: listRolePermissions
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/roleId'
    responses:
      '200':
        description: Role permissions retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/role.yaml#/RolePermissionList'
      '401':
        $ref: '../index.yaml#/components/responses/UnauthorizedError'
      '403':
        $ref: '../index.yaml#/components/responses/ForbiddenError'
      '404':
        $ref: '../index.yaml#/components/responses/NotFoundError'
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'

addRolePermission:
  post:
    tags:
      - Admin - Roles & Permissions
    summary: Add permission to role
    description: |
      Assign a permission to a role (requires admin:roles:manage permission).
      System-defined roles cannot be modified.
    operationId: addRolePermission
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/roleId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/role.yaml#/RolePermissionAddRequest'
    responses:
      '201':
        description: Permission added to role successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/role.yaml#/RolePermission'
      '401':
        $ref: '../index.yaml#/components/responses/UnauthorizedError'
      '403':
        $ref: '../index.yaml#/components/responses/ForbiddenError'
      '404':
        description: Role or permission not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/Error'
      '409':
        description: Permission already assigned or system role cannot be modified
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/Error'
            example:
              status: 409
              message: Conflict
              error: Permission is already assigned to this role
      '422':
        $ref: '../index.yaml#/components/responses/ValidationError'
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'

removeRolePermission:
  delete:
    tags:
      - Admin - Roles & Permissions
    summary: Remove permission from role
    description: |
      Remove a permission from a role (requires admin:roles:manage permission).
      System-defined roles cannot be modified.
    operationId: removeRolePermission
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/roleId'
      - $ref: '../components/parameters.yaml#/permissionId'
    responses:
      '204':
        description: Permission removed from role successfully
      '401':
        $ref: '../index.yaml#/components/responses/UnauthorizedError'
      '403':
        $ref: '../index.yaml#/components/responses/ForbiddenError'
      '404':
        $ref: '../index.yaml#/components/responses/NotFoundError'
      '409':
        description: System role cannot be modified
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/Error'
            example:
              status: 409
              message: Conflict
              error: System-defined roles cannot be modified
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'

listPermissions:
  get:
    tags:
      - Admin - Roles & Permissions
    summary: List all permissions
    description: Get all available permissions in the system (requires admin:permissions:read permission)
    operationId: listPermissions
    security:
      - bearerAuth: []
    parameters:
      - name: resource
        in: query
        required: false
        description: Filter by resource type
        schema:
          type: string
        example: 'devices'
      - name: action
        in: query
        required: false
        description: Filter by action
        schema:
          type: string
          enum:
            - read
            - manage
            - assign
        example: 'manage'
    responses:
      '200':
        description: Permissions retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/role.yaml#/PermissionList'
      '401':
        $ref: '../index.yaml#/components/responses/UnauthorizedError'
      '403':
        $ref: '../index.yaml#/components/responses/ForbiddenError'
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'
