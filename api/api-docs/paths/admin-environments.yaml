# Admin - Environments Endpoints

listEnvironments:
  get:
    tags:
      - Admin - Environments
    summary: List all environments
    description: Get all environments across all organizations (requires admin:environments:read permission)
    operationId: adminListEnvironments
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/limit'
      - $ref: '../components/parameters.yaml#/offset'
      - $ref: '../components/parameters.yaml#/search'
      - name: orgId
        in: query
        required: false
        description: Filter by organization ID
        schema:
          type: string
          format: uuid
        example: '123e4567-e89b-12d3-a456-426614174000'
      - name: type
        in: query
        required: false
        description: Filter by environment type
        schema:
          type: string
          enum:
            - live
            - sandbox
        example: 'live'
      - name: sortBy
        in: query
        required: false
        description: Field to sort by
        schema:
          type: string
          enum:
            - created_at
            - updated_at
            - name
          default: created_at
        example: 'name'
      - name: sortOrder
        in: query
        required: false
        description: Sort order
        schema:
          type: string
          enum:
            - asc
            - desc
          default: desc
        example: 'asc'
    responses:
      '200':
        description: Environments retrieved successfully
        content:
          application/json:
            schema:
              type: object
              required:
                - data
                - pagination
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas/environment.yaml#/Environment'
                pagination:
                  $ref: '../components/schemas/common.yaml#/PaginationInfo'
      '401':
        $ref: '../index.yaml#/components/responses/UnauthorizedError'
      '403':
        $ref: '../index.yaml#/components/responses/ForbiddenError'
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'

getEnvironment:
  get:
    tags:
      - Admin - Environments
    summary: Get environment details
    description: Retrieve detailed information about a specific environment (requires admin:environments:read permission)
    operationId: adminGetEnvironment
    security:
      - bearerAuth: []
    parameters:
      - name: envId
        in: path
        required: true
        description: Environment ID
        schema:
          type: string
          format: uuid
        example: '123e4567-e89b-12d3-a456-426614174000'
    responses:
      '200':
        description: Environment retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/environment.yaml#/Environment'
      '401':
        $ref: '../index.yaml#/components/responses/UnauthorizedError'
      '403':
        $ref: '../index.yaml#/components/responses/ForbiddenError'
      '404':
        $ref: '../index.yaml#/components/responses/NotFoundError'
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'

updateEnvironment:
  put:
    tags:
      - Admin - Environments
    summary: Update environment
    description: Update environment details (requires admin:environments:manage permission)
    operationId: adminUpdateEnvironment
    security:
      - bearerAuth: []
    parameters:
      - name: envId
        in: path
        required: true
        description: Environment ID
        schema:
          type: string
          format: uuid
        example: '123e4567-e89b-12d3-a456-426614174000'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: Environment name
                example: 'Production'
              type:
                type: string
                enum:
                  - live
                  - sandbox
                description: Environment type
                example: 'live'
              description:
                type: string
                description: Environment description
                example: 'Production environment for customer-facing systems'
    responses:
      '200':
        description: Environment updated successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/environment.yaml#/Environment'
      '401':
        $ref: '../index.yaml#/components/responses/UnauthorizedError'
      '403':
        $ref: '../index.yaml#/components/responses/ForbiddenError'
      '404':
        $ref: '../index.yaml#/components/responses/NotFoundError'
      '422':
        $ref: '../index.yaml#/components/responses/ValidationError'
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'

deleteEnvironment:
  delete:
    tags:
      - Admin - Environments
    summary: Delete environment
    description: |
      Soft-delete an environment (requires admin:environments:manage permission).
      Cannot delete default environments (Live, Test).
    operationId: adminDeleteEnvironment
    security:
      - bearerAuth: []
    parameters:
      - name: envId
        in: path
        required: true
        description: Environment ID
        schema:
          type: string
          format: uuid
        example: '123e4567-e89b-12d3-a456-426614174000'
    responses:
      '204':
        description: Environment deleted successfully
      '401':
        $ref: '../index.yaml#/components/responses/UnauthorizedError'
      '403':
        $ref: '../index.yaml#/components/responses/ForbiddenError'
      '404':
        $ref: '../index.yaml#/components/responses/NotFoundError'
      '409':
        description: Cannot delete default environment
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/Error'
            example:
              status: 409
              message: Conflict
              error: Cannot delete default environments
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'
