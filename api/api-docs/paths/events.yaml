getEvent:
  get:
    tags:
      - Core - Events
    summary: Get event details
    description: Retrieve detailed information about a specific event
    operationId: getEvent
    security:
      - bearerAuth: ["events:read"]
    parameters:
      - $ref: '../components/parameters.yaml#/orgId'
      - $ref: '../components/parameters.yaml#/envId'
      - $ref: '../components/parameters.yaml#/eventId'
    responses:
      '200':
        description: Event retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/event.yaml#/Event'
      '401':
        $ref: '../index.yaml#/components/responses/UnauthorizedError'
      '403':
        $ref: '../index.yaml#/components/responses/ForbiddenError'
      '404':
        $ref: '../index.yaml#/components/responses/NotFoundError'
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'
