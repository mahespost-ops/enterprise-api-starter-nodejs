listSessions:
  get:
    tags:
      - Sessions
    summary: List user's sessions
    description: Get all active sessions for the authenticated user
    operationId: listSessions
    security:
      - bearerAuth: []
    responses:
      '200':
        description: List of sessions
        content:
          application/json:
            schema:
              $ref: '../components/schemas/session.yaml#/SessionList'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedError'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

getSession:
  get:
    tags:
      - Sessions
    summary: Get session details
    description: Get detailed information about a specific session
    operationId: getSession
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Session ID
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Session details
        content:
          application/json:
            schema:
              $ref: '../components/schemas/session.yaml#/Session'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

revokeSession:
  delete:
    tags:
      - Sessions
    summary: Revoke specific session
    description: Revoke a specific session by ID
    operationId: revokeSession
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Session ID
        schema:
          type: string
          format: uuid
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas/session.yaml#/SessionRevocationRequest'
    responses:
      '204':
        description: Session revoked successfully
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

revokeDeviceSessions:
  delete:
    tags:
      - Sessions
    summary: Revoke all sessions for device
    description: Revoke all sessions associated with a specific device
    operationId: revokeDeviceSessions
    security:
      - bearerAuth: []
    parameters:
      - name: deviceId
        in: path
        required: true
        description: Device ID
        schema:
          type: string
          format: uuid
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas/session.yaml#/SessionRevocationRequest'
    responses:
      '204':
        description: All device sessions revoked successfully
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

revokeAllSessionsExceptCurrent:
  delete:
    tags:
      - Sessions
    summary: Revoke all sessions except current
    description: Revoke all user sessions except the current one
    operationId: revokeAllSessionsExceptCurrent
    security:
      - bearerAuth: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas/session.yaml#/SessionRevocationRequest'
    responses:
      '204':
        description: All other sessions revoked successfully
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedError'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

revokeAllSessions:
  delete:
    tags:
      - Sessions
    summary: Revoke all sessions
    description: Revoke all user sessions including current (force logout everywhere)
    operationId: revokeAllSessions
    security:
      - bearerAuth: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas/session.yaml#/SessionRevocationRequest'
    responses:
      '204':
        description: All sessions revoked successfully
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedError'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'
