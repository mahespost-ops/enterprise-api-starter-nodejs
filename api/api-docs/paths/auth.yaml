register:
  post:
    tags:
      - Core - Authentication
    summary: Register new user
    description: Create a new user account and send magic token for verification
    operationId: register
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/RegisterRequest'
    responses:
      '201':
        description: User successfully registered, magic token sent
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/RequestMagicTokenResponse'
      '409':
        description: User already exists
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/Error'
            example:
              status: 409
              message: Conflict
              error: User with this email already exists
      '422':
        $ref: '../index.yaml#/components/responses/ValidationError'
      '429':
        $ref: '../index.yaml#/components/responses/RateLimitError'
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'

requestToken:
  post:
    tags:
      - Core - Authentication
    summary: Request magic token
    description: Request a passwordless magic token via email or SMS
    operationId: requestMagicToken
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/RequestMagicTokenRequest'
    responses:
      '200':
        description: Magic token sent successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/RequestMagicTokenResponse'
      '404':
        $ref: '../index.yaml#/components/responses/NotFoundError'
      '422':
        $ref: '../index.yaml#/components/responses/ValidationError'
      '429':
        $ref: '../index.yaml#/components/responses/RateLimitError'
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'

verifyToken:
  post:
    tags:
      - Core - Authentication
    summary: Verify magic token
    description: Verify magic token and receive access + refresh tokens
    operationId: verifyMagicToken
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/VerifyMagicTokenRequest'
    responses:
      '200':
        description: Successfully authenticated
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/AuthResponse'
        headers:
          Set-Cookie:
            description: httpOnly secure cookie with refresh token
            schema:
              type: string
              example: refreshToken=abc123...; HttpOnly; Secure; SameSite=Strict; Max-Age=2592000
      '401':
        $ref: '../index.yaml#/components/responses/UnauthorizedError'
      '422':
        $ref: '../index.yaml#/components/responses/ValidationError'
      '429':
        $ref: '../index.yaml#/components/responses/RateLimitError'
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'

refresh:
  post:
    tags:
      - Core - Authentication
    summary: Refresh access token
    description: |
      Get new access and refresh tokens using current refresh token.
      Refresh token can be provided in cookie or request body.
      Returns new rotated refresh token for security.
    operationId: refreshToken
    security: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/RefreshTokenRequest'
    responses:
      '200':
        description: New tokens generated successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/RefreshTokenResponse'
        headers:
          Set-Cookie:
            description: New httpOnly secure cookie with rotated refresh token
            schema:
              type: string
              example: refreshToken=xyz789...; HttpOnly; Secure; SameSite=Strict; Max-Age=2592000
      '401':
        $ref: '../index.yaml#/components/responses/UnauthorizedError'
      '422':
        $ref: '../index.yaml#/components/responses/ValidationError'
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'

logout:
  post:
    tags:
      - Core - Authentication
    summary: User logout
    description: Invalidate current session and refresh token
    operationId: logout
    security:
      - bearerAuth: ["sessions:manage"]
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              refreshToken:
                type: string
                description: Refresh token to invalidate (optional if in cookie)
                example: a7b3c4d5e6f7890123456789abcdef01234567890123456789abcdef012345
    responses:
      '204':
        description: Successfully logged out
        headers:
          Set-Cookie:
            description: Clear refresh token cookie
            schema:
              type: string
              example: refreshToken=; HttpOnly; Secure; SameSite=Strict; Max-Age=0
      '401':
        $ref: '../index.yaml#/components/responses/UnauthorizedError'
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'

switchContext:
  post:
    tags:
      - Core - Authentication
    summary: Switch organization/environment context
    description: |
      Switch the user's current organization and environment context.
      Updates last_org_id and last_env_id on organization_member.
      Returns new JWT with updated orgId and envId claims.

      Includes device fingerprinting for security tracking, consistent with other auth endpoints.
    operationId: switchContext
    security:
      - bearerAuth: ["organizations:read"]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/SwitchContextRequest'
    responses:
      '200':
        description: Context switched successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/SwitchContextResponse'
      '401':
        $ref: '../index.yaml#/components/responses/UnauthorizedError'
      '403':
        $ref: '../index.yaml#/components/responses/ForbiddenError'
      '404':
        $ref: '../index.yaml#/components/responses/NotFoundError'
      '422':
        $ref: '../index.yaml#/components/responses/ValidationError'
      '500':
        $ref: '../index.yaml#/components/responses/InternalServerError'
