      '404':
        $ref: '../components/responses.yaml#/NotFoundError'
      '422':
        $ref: '../components/responses.yaml#/ValidationError'
      '429':
        $ref: '../components/responses.yaml#/RateLimitError'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

  delete:
    tags:
      - Core - Webhooks
    summary: Delete webhook
    description: Delete a webhook
    operationId: deleteWebhook
    security:
      - BearerAuth: ["webhooks:manage"]
    parameters:
      - $ref: '../components/parameters.yaml#/orgId'
      - $ref: '../components/parameters.yaml#/envId'
      - $ref: '../components/parameters.yaml#/webhookId'
    responses:
      '204':
        description: Webhook deleted successfully
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses.yaml#/NotFoundError'
      '429':
        $ref: '../components/responses.yaml#/RateLimitError'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

/orgs/{orgId}/envs/{envId}/webhooks/{webhookId}/deliveries:
  get:
    tags:
      - Core - Webhooks
    summary: List webhook deliveries
    description: List all deliveries for a specific webhook
    operationId: listWebhookDeliveries
    security:
      - BearerAuth: ["webhooks:read"]
    parameters:
      - $ref: '../components/parameters.yaml#/orgId'
      - $ref: '../components/parameters.yaml#/envId'
      - $ref: '../components/parameters.yaml#/webhookId'
      - $ref: '../components/parameters.yaml#/limit'
      - $ref: '../components/parameters.yaml#/offset'
      - name: status
        in: query
        description: Filter by delivery status
        schema:
          type: string
          enum: [pending, success, failed, retrying]
          example: "failed"
      - name: fromDate
        in: query
        description: Filter deliveries from this date (UTC, ISO 8601)
        schema:
          type: string
          format: date-time
          example: "2025-10-01T00:00:00.000Z"
      - name: toDate
        in: query
        description: Filter deliveries to this date (UTC, ISO 8601)
        schema:
          type: string
          format: date-time
          example: "2025-10-03T23:59:59.999Z"
    responses:
      '200':
        description: Deliveries retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/webhook.yaml#/WebhookDeliveryList'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses.yaml#/NotFoundError'
      '429':
        $ref: '../components/responses.yaml#/RateLimitError'
      '500':
        $ref: '../components/responses.yaml#/InternalServerError'

